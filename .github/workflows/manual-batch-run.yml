name: Weekly Model Governance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 0"
  pull_request:
    paths:
      - "data/registry/**"
      - "data/governance/**"
      - "data/market_inputs/**"
      - "data/watchlists/**"
      - "data/examples/**"
      - "data/model_factor_matrix_min.json"
      - "agents/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/manual-batch-run.yml"
  push:
    branches:
      - main
    paths:
      - "data/registry/**"
      - "data/governance/**"
      - "data/market_inputs/**"
      - "data/watchlists/**"
      - "data/examples/**"
      - "data/model_factor_matrix_min.json"
      - "agents/**"
      - "scripts/**"
      - ".github/workflows/manual-batch-run.yml"

permissions:
  contents: write

jobs:
  weekly-model-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run test suite
        run: pytest tests -q

      - name: Generate weekly governance health report
        run: python scripts/generate_weekly_health_report.py
        env:
          PYTHONPATH: .

      - name: Run deterministic watchlist batch
        run: python scripts/run_manual_batch.py
        env:
          PYTHONPATH: .

      - name: Commit generated artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs data/reports data/dashboard/latest_dashboard_data.json app/dashboard/public/dashboard_data.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: persist weekly model governance outputs"
          git push origin HEAD:main
